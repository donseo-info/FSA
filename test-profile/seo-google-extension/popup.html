
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
    }
    .logo {
      font-size: 18px;
      font-weight: bold;
      color: #4285f4;
    }
    .status {
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
    }
    .active {
      background-color: #e8f5e8;
      color: #2e7d32;
    }
    .button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .primary {
      background-color: #4285f4;
      color: white;
    }
    .secondary {
      background-color: #f1f3f4;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Test SEO Plugin</div>
    <div>v2.0.0</div>
  </div>
  
  <div class="status active">
    ✅ Plugin Active
  </div>
  
  <button class="button primary" id="analyzeBtn">
    Analyze Current Page
  </button>
  
  <button class="button secondary" id="settingsBtn">
    Settings
  </button>
  
  <div id="results" style="margin-top: 15px; font-size: 12px;">
    Click "Analyze" to see SEO metrics
  </div>
  
  <script>
    document.getElementById('analyzeBtn').addEventListener('click', () => {
      chrome.tabs.query({active: true, currentWindow: true}, (tabs) => {
        chrome.tabs.sendMessage(tabs[0].id, {action: 'analyze'}, (response) => {
          document.getElementById('results').innerHTML = 
            'SEO Score: ' + (response?.score || 'N/A') + '<br>' +
            'Page: ' + tabs[0].title;
        });
      });
    });
    
    document.getElementById('settingsBtn').addEventListener('click', () => {
      chrome.runtime.openOptionsPage();
    });
  </script>
</body>
</html>
