<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yandex Music Downloader V3</title>
  <script src="/libs/footer/footer.js"></script>
  <link rel="stylesheet" href="/libs/footer/footer.css">

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.2/css/solid.css"
    integrity="sha384-6qO6EOFIDfvv6uzAzozX/BvMu/qkIIHxWYOVMjpVjX+NtPuNyd3YiOEflKIIV2ka" crossorigin="anonymous">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.2/css/regular.css"
    integrity="sha384-GMkIgTgosuQEt2PEwBHI7MMRsrQplN2sT/7bzPOIxG+Hn37iTlZXFb37m6uE+iHj" crossorigin="anonymous">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.2/css/brands.css"
    integrity="sha384-RTi1U6SIW2G3kUi5NslKQjA34F8CsQCVduJO50jqtxhR2KY++LR7KZS2886EwXrk" crossorigin="anonymous">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.2/css/fontawesome.css"
    integrity="sha384-Hx1dya9ptAdKu2hLNR5C2Cwgm+wCfwD0VMGE6jk5OUxxa9I58YfxOCwEtRog+3wk" crossorigin="anonymous">

  <link rel="stylesheet" href="../styles/popup.css">
</head>

<body>
  <div class="new-design-warning" style="display: none;">
    <div class="warning-content">
      <h3 loc="new_design_warning_title">New Design Not Supported</h3>
      <p loc="new_design_warning_text">This app doesn't support the New Design. Please switch back to the old design to
        continue downloading music.</p>
      <img src="../images/go-to-old-design.png" alt="How to switch to old design" class="design-instruction">
    </div>
  </div>
  <div class="download-content">
    <div class="header row">
      <div class="cell">
        <i id="btnStopAll" loc loc-title="stop_all_title" class="fas fa-pause-circle"></i>
        <i id="btnClearAll" loc="" loc-title="clear_all_title" class="fas fa-trash-alt"
          title="Clear download queue"></i>
      </div>
      <div class="cell" loc="popup_name">Name</div>
      <div class="cell" loc="popup_time_lift">Time left</div>
      <div class="cell" loc="download_speed">Speed</div>
    </div>
    <download-queue class="table">
    </download-queue>
    <div class="footer">
      <div class="footer-row">
        <div class="footer-cell">
          <div class="rating-control">
            <span class="rate-text" loc="popup_rate_us">Rate us: </span>
            <span class="stars">
              <span class="star" data-rating="1" title="😫">&#9733;</span>
              <span class="star" data-rating="2" title="🤨">&#9733;</span>
              <span class="star" data-rating="3" title="😐">&#9733;</span>
              <span class="star" data-rating="4" title="🙂">&#9733;</span>
              <span class="star" data-rating="5" title="😍">&#9733;</span>
            </span>
          </div>
        </div>
        <div class="footer-cell">
          <span class="support-min" loc="popup_support" loc-title="popup_support_title"
            title="Email to dreambuilder.first@gmail.com (click to copy to clipboard)">Support
          </span>
          <span id="goOptions" loc loc-title="options_title" title="Open app options">
            <svg fill="#000000" version="1.1" id="options-icon" xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink" width="800px" height="800px" viewBox="0 0 45.973 45.973"
              xml:space="preserve">
              <g>
                <g>
                  <path d="M43.454,18.443h-2.437c-0.453-1.766-1.16-3.42-2.082-4.933l1.752-1.756c0.473-0.473,0.733-1.104,0.733-1.774
                      c0-0.669-0.262-1.301-0.733-1.773l-2.92-2.917c-0.947-0.948-2.602-0.947-3.545-0.001l-1.826,1.815

                      C4.802,8.672,4.535,9.318,4.535,9.978c0,0.669,0.259,1.299,0.733,1.772l1.752,1.76c-0.921,1.513-1.629,3.167-2.081,4.933H2.501

                      s1.299-0.261,1.773-0.733l1.833-1.816c1.498,0.873,3.112,1.545,4.878,1.978v2.604c0,1.383,1.088,2.498,2.471,2.498h4.128

                      c0.92-1.514,1.627-3.179,2.08-4.943h2.438c1.383,0,2.52-1.087,2.52-2.471v-4.125C45.973,19.555,44.837,18.443,43.454,18.443z

                </g>
              </g>
            </svg>
          </span>
        </div>
      </div>
      <div class="footer-row">
        <!-- <span id="donateText">Buy coffee 🍵</span> -->
        <span id="donateBtn" class="donate-btn-text" title="Tips for coffee">Buy coffee 🍵</span>
        <div class="footer-cell">
          <span id="app-version" class="app-version" loc-title="app_version"></span>
          <span id="goPremium" class="premium-icon" loc-title="premium_features_tooltip" title="Premium features">
            Pro
          </span>
        </div>
      </div>
    </div>
  </div>
  <script src="../popup.js"></script>
</body>

</html>
