<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Yandex Music Downloader Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <h1 loc="settings_header">Settings</h1>

    <form id="settingsForm">
      <div class="form-group">
        <label for="filenameFormat" loc="filename_format_label">Filename Format</label>
        <input type="text" id="filenameFormat" class="form-control">
        <small class="help-text" loc="available_variables_text">
          Available variables: {title}, {version}, {artist}, {artists}, {album}, {tracknumber}, {trackindex}
        </small>
        <div class="preview" loc="preview_label">
          <span id="filenamePreview"></span>
        </div>
      </div>

      <div class="form-group select">
        <label for="coverSize" loc="cover_size_label">Cover Size</label>
        <select id="coverSize" class="form-control form-control-narrow">
          <option value="300">300x300</option>
          <option value="1000">1000x1000</option>
        </select>
      </div>

      <div class="form-group checkbox">
        <input type="checkbox" id="albumsFolder">
        <label for="albumsFolder" loc="download_albums_label">Download albums to separate folders</label>
      </div>

      <div class="form-group checkbox">
        <input type="checkbox" id="artistsFolder">
        <label for="artistsFolder" loc="download_artists_label">Download artists to separate folders</label>
      </div>

      <div class="form-group checkbox">
        <input type="checkbox" id="playlistsFolder">
        <label for="playlistsFolder" loc="download_playlists_label">Download playlists to separate folders</label>
      </div>

      <div class="form-group checkbox">
        <input type="checkbox" id="showProgressPopup">
        <label for="showProgressPopup" loc="show_progress_popup_label">Show Progress Popup</label>
      </div>

      <div class="form-group">
        <label class="checkbox" for="downloadLossless">
          <input type="checkbox" id="downloadLossless" name="downloadLossless">
          <span loc="options_download_lossless">Download FLAC files when available</span>
          <span class="info-badge">⭐</span>
          <span class="donate-badge" style="display: none;" title="Buy coffee">
            <img src="../images/donate.png" alt="Donate" class="donate-icon">
          </span>
        </label>
        <p class="help-text" loc="options_download_lossless_help">
          When enabled, the extension will try to download FLAC files instead of MP3 when available.
        </p>
      </div>

      <button type="submit" class="btn-primary" loc="save_settings_button">Save Settings</button>
      
      <div class="hidden-link">
        <a href="../hidden-options/index.html" id="advancedLink" class="hidden-advanced-link">Advanced Settings</a>
      </div>
    </form>

    <div id="savedMessage" class="message success hidden" loc="settings_saved_message">
      Settings saved successfully!
    </div>
  </div>
  <script src="../options.js"></script>
</body>

</html>
